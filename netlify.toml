[build]
command = "npm install"
functions = "netlify/functions"
publish = "."

[[redirects]]
from = "/.netlify/functions/:name"
to = "/.netlify/functions/:name"
status = 200

[env]
[env.production]
  [env.production.context]
    EMAIL_USER = ""
    EMAIL_PASS = ""
    TWILIO_ACCOUNT_SID = ""
    TWILIO_AUTH_TOKEN = ""
    TWILIO_PHONE_NUMBER = ""

[env.development]
  [env.development.context]
    EMAIL_USER = ""
    EMAIL_PASS = ""
    TWILIO_ACCOUNT_SID = ""
    TWILIO_AUTH_TOKEN = ""
    TWILIO_PHONE_NUMBER = ""
